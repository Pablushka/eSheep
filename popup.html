<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      color: #243128;
      background: #f5f1e8;
      font: 14px/1.4 'Roboto', sans-serif;
      text-align: center;
    }
    h3 { margin: 0 0 6px; font-size: 20px; }
    .subtitle { margin: 0 0 16px; font-size: 12px; color: #7a887c; font-weight: 500; }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      background: #42634c;
      cursor: pointer;
      font: inherit;
    }
    button[aria-pressed="false"] { background: #7d8178; }
    #status { margin: 12px 0 18px; font-size: 13px; }
    .section-label {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #66826f;
      text-align: left;
    }
    .samples {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .samples button {
      padding: 8px 4px;
      font-size: 12px;
      background: #e7e0d2;
      color: #334b3a;
      border-radius: 5px;
      text-transform: capitalize;
    }
    .samples button:hover { background: #42634c; color: #fff; }
  </style>
</head>
<body>
  <h3>eSheep 🐑</h3>
  <p class="subtitle">Control your eSheep 1.0.01</p>
  <button id="toggle" type="button" aria-pressed="true">Sheep are roaming</button>
  <p id="status">Your browsing companion is on.</p>

  <p class="section-label">Animation samples</p>
  <div class="samples">
    <button type="button" data-animation="walk">Walk</button>
    <button type="button" data-animation="run">Run</button>
    <button type="button" data-animation="jump">Jump</button>
    <button type="button" data-animation="boing">Boing</button>
    <button type="button" data-animation="drag">Drag</button>
    <button type="button" data-animation="fall">Fall</button>
    <button type="button" data-animation="fall fast">Fall fast</button>
    <button type="button" data-animation="fall soft">Fall soft</button>
    <button type="button" data-animation="fall hard">Fall hard</button>
    <button type="button" data-animation="sleep1a">Sleep</button>
    <button type="button" data-animation="sleep3a">Deep sleep</button>
    <button type="button" data-animation="eat">Eat</button>
    <button type="button" data-animation="batha">Bath</button>
    <button type="button" data-animation="flower">Flower</button>
    <button type="button" data-animation="pissa">Pee</button>
    <button type="button" data-animation="kill">Faint</button>
    <button type="button" data-animation="rotate1a">Turn</button>
    <button type="button" data-animation="look_down">Look down</button>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
