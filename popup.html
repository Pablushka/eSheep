<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 20px;
      color: #243128;
      background: #f5f1e8;
      font: 15px/1.4 Georgia, serif;
      text-align: center;
    }
    h3 { margin: 0 0 14px; font-size: 20px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      background: #42634c;
      cursor: pointer;
      font: inherit;
    }
    button[aria-pressed="false"] { background: #7d8178; }
    #status { margin: 12px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <h3>eSheep 🐑</h3>
  <h2>Control your eSheep 1.0.01</h2>
  <button id="toggle" type="button" aria-pressed="true">Sheep are roaming</button>
  <p id="status">Your browsing companion is on.</p>
  <script src="dist/popup.js"></script>
</body>
</html>
